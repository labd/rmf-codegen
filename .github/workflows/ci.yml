on:
  - workflow_dispatch
  - push

name: CI

permissions: {}

jobs:
  test:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Build and Release
        run: ./gradlew clean check shadowJar

      - run: ./scripts/install_local.sh
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: test
          persist-credentials: 'false'

      - name: Test validate
        continue-on-error: true
        run: rmf-codegen validate -f GITHUB -r ./api-spec/ruleset.xml ./api-spec/api.raml
        working-directory: test
  test_node:
    name: Build npm package

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"

      - name: Build npm package
        working-directory: node/rmf-codegen
        run: yarn build

      - name: Run npm package
        working-directory: node/rmf-codegen
        run: node bin/rmf-codegen.js
